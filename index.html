<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Digital: Convivência Escolar</title>

    <link rel="icon" href="img/favicon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="card-container">
        <header class="header-flex">
            <div class="header-brand">
                <img id="logoColegioForm" src="img/logo.png" alt="Logo Escola"
                    onerror="this.src='https://via.placeholder.com/80?text=LOGO'"
                    style="height: 50px; width: auto; object-fit: contain;">
                <div>
                    <h1 id="tituloColegioForm">🔒 Pesquisa Anônima: Convivência Digital</h1>
                    <p style="font-size: 0.85rem; color: #718096; margin-top: 4px;">
                        Sua participação é confidencial. Não pedimos nome, e-mail ou matrícula.
                    </p>
                </div>
            </div>
            <a href="admin.html" class="btn-admin-login">🔑 Login Admin</a>
        </header>

        <form id="pesquisaForm">
            <div class="field-group"
                style="background: #ebf8ff; padding: 15px; border-radius: 8px; border: 1px solid #90cdf4; margin-bottom: 25px;">
                <label for="colegio_selecionado" style="color: #2b6cb0;">🏫 Selecione sua Instituição ou Setor:</label>
                <select id="colegio_selecionado" required style="border-color: #63b3ed; font-weight: bold;">
                    <option value="">Carregando instituições...</option>
                </select>
            </div>

            <div id="containerPerguntas">
                <p>Carregando formulário...</p>
            </div>
            <button type="submit" id="btnSalvar" style="display: none; margin-top: 20px;">💾 Salvar Resposta
                Anônima</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
