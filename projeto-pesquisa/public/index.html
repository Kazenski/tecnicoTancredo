<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pesquisa Escolar: Convivência Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 id="titulo-form">Pesquisa Anônima: Cyberbullying</h1>
        <p>Garantimos 100% de anonimato. Não pedimos seu nome, e-mail ou matrícula.</p>

        <form id="pesquisaForm">
            <div class="pergunta">
                <label for="idade">Qual a sua idade?</label>
                <input type="number" id="idade" name="idade" required min="10" max="21">
            </div>

            <div class="pergunta">
                <label>Você já foi vítima de mensagens ofensivas ou exposição virtual?</label>
                <select id="foi_vitima" name="foi_vitima" required>
                    <option value="">Selecione...</option>
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                </select>
            </div>

            <button type="submit">Salvar Dados Anônimos</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>

</html>
